name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支只保留最新一次运行，避免排队堆积
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------- 构建与测试（任何 push / PR 都跑）----------
  build:
    name: 构建与测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 本项目 compileSdk 36 / buildToolsVersion 36.0.0（写死在 app/build.gradle.kts）
      # runner 已预装 Android SDK 与 cmdline-tools，不再用 setup-android（它在这些镜像上常装 cmdline-tools 失败）
      - name: 安装 SDK 平台与构建工具
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: 赋可执行权限
        run: chmod +x gradlew

      # 143 个单元/集成测试（含回环 socket、Robolectric UI、二维码解码、BLE 分片）
      - name: 单元测试
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: 打包 Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 上传产物与报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-artifacts
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html

  # ---------- 已签名 release（打 tag 或手动触发；需要仓库存好 4 个 Secret）----------
  release:
    name: 已签名 Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write   # 需要它才能把 APK 附到 Release

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # runner 已预装 Android SDK 与 cmdline-tools，不再用 setup-android（它在这些镜像上常装 cmdline-tools 失败）
      - name: 安装 SDK 平台与构建工具
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: 赋可执行权限
        run: chmod +x gradlew

      # 把 Secret 映射成 env 才能在 if 里判断是否存在（job 级 if 读不到 secrets）
      - name: 写入签名配置
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "没有配置签名 Secret，跳过已签名构建（只出未签名包）。"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: 打包已签名 Release APK
        if: steps.signing.outputs.enabled == 'true'
        run: ./gradlew assembleRelease -PversionName="${GITHUB_REF_NAME#v}" --stacktrace

      - name: 校验签名
        if: steps.signing.outputs.enabled == 'true'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BS=$(ls -d "$ANDROID_HOME"/build-tools/36.0.0 | head -1)
          "$BS/apksigner" verify --print-certs "$APK"

      - name: 上传 Release APK
        if: steps.signing.outputs.enabled == 'true'
        run: |
          SRC=app/build/outputs/apk/release/app-release.apk
          NAME="DrawLots-${GITHUB_REF_NAME#v}.apk"
          cp "$SRC" "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          ls -lh "$NAME"

      - name: 上传 Release APK 为产物
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: DrawLots-*.apk

      - name: 附到 GitHub Release（仅 tag 触发时）
        if: steps.signing.outputs.enabled == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" "$APK_NAME" --clobber \
            || gh release create "$GITHUB_REF_NAME" "$APK_NAME" --title "DrawLots ${GITHUB_REF_NAME#v}" --generate-notes
